<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - TicketPortal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .event-detail-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        .event-hero {
            width: 100%;
            height: 350px;
            border-radius: 20px;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .event-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2));
            border-radius: 20px;
        }
        .event-hero-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem;
            z-index: 2;
            color: white;
        }
        .event-hero-content h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .event-hero-content .status-badge {
            display: inline-block;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.3rem;
        }
        .event-info-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .event-info-card h3 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: var(--text-color);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.8rem;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .info-item .label {
            font-size: 0.8rem;
            color: var(--subtext-color);
            opacity: 0.7;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .info-item .value {
            font-size: 1rem;
            color: var(--text-color);
            font-weight: 500;
        }
        .action-buttons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--card-border);
        }
        .action-btn {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .action-btn.active-btn { background: #4CAF50; }
        .action-btn.broadcast-btn { background: #026CDF; }
        .action-btn.stop-btn { background: #FF9800; }
        .action-btn.delete-btn { background: #ff4444; }
        .action-btn.edit-btn { background: #9C27B0; }
        @media (max-width: 768px) {
            .info-grid { grid-template-columns: 1fr; }
            .event-hero { height: 250px; }
            .event-hero-content h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="app-shell">
    <nav class="navbar"><div class="brand"><span class="brand-ticket">🎫</span><span>Ticket<span>Portal</span></span></div><div class="nav-links"><a href="index.html">Home</a><a href="total-events.html">Total Events</a><a href="index.html#addEventNavBtn">Add</a><button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button></div></nav>
    <aside class="sidebar"><div class="sidebar-inner"><div class="sidebar-label">QUICK TOOLS</div><button class="sidebar-action" type="button" onclick="alert('Bulk action selection can be connected to your multi-event workflow here.')"><span class="sidebar-icon"><i class="fas fa-layer-group"></i></span><span><strong>Bulk Actions</strong><small>Manage multiple events</small></span><i class="fas fa-chevron-right sidebar-chevron"></i></button></div></aside>

    <!-- Event Details -->
    <main class="main-content">
    <div class="event-detail-container" id="eventDetailContainer">
        <a href="total-events.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to All Events</a>
        <div id="eventContent">
            <p style="color: var(--subtext-color);">Loading event details...</p>
        </div>
    </div>
    </main>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Event</h2>
                <button class="close-btn" onclick="document.getElementById('editModal').style.display='none'">&times;</button>
            </div>
            <p class="modal-subtitle">Update the event details below.</p>
            <form id="editForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Event Name *</label>
                        <input type="text" id="editEventName" required>
                    </div>
                    <div class="form-group">
                        <label>Event Mapping ID *</label>
                        <input type="text" id="editEventMappingID" required>
                    </div>
                    <div class="form-group">
                        <label>Venue Name *</label>
                        <input type="text" id="editVenueName" required>
                    </div>
                    <div class="form-group">
                        <label>Event ID *</label>
                        <input type="text" id="editEventID" required>
                    </div>
                    <div class="form-group">
                        <label>Event Start Time *</label>
                        <input type="datetime-local" id="editEventStartTime" required>
                    </div>
                    <div class="form-group">
                        <label>Transfer Date *</label>
                        <input type="date" id="editTransferDate" required>
                    </div>
                    <div class="form-group">
                        <label>List Cost Percentage *</label>
                        <input type="number" id="editListCost" required>
                    </div>
                    <div class="form-group">
                        <label>Event Status *</label>
                        <select id="editEventStatus" required>
                            <option value="Active">Active</option>
                            <option value="Broadcasted">Broadcasted</option>
                            <option value="Unbroadcasted">Unbroadcasted</option>
                        </select>
                    </div>
                </div>
                <div class="form-group full-width">
                    <label>Event URL</label>
                    <input type="url" id="editEventURL" placeholder="https://...">
                </div>
                <div class="form-group full-width">
                    <label>Event Image URL</label>
                    <input type="url" id="editEventImageURL" placeholder="https://...">
                </div>
                <button type="submit" class="submit-event-btn">Save Changes</button>
            </form>
        </div>
    </div>

    <script src="event-details.js"></script>
</body>
</html>
