<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Events - TicketPortal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Navbar -->
        <nav class="navbar">
        <div class="brand-area">
            <button class="menu-toggle" id="menuToggleBtn" aria-label="Open navigation menu" aria-expanded="false">
                <i class="fas fa-bars"></i>
            </button>
            <a href="index.html" class="brand-home" aria-label="Go to home">🎫 TicketPortal</a>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="total-events.html">Total Events</a>
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">
                <i class="fas fa-moon"></i>
            </button>
        </div>
        </nav>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Navigation</h2>
            <button class="sidebar-close" id="sidebarCloseBtn" aria-label="Close navigation menu">&times;</button>
        </div>
        <a href="#" class="sidebar-link"><i class="fas fa-receipt"></i> Orders</a>
        <a href="total-events.html" class="sidebar-link"><i class="fas fa-calendar-days"></i> Total Events</a>
        <a href="#" class="sidebar-link"><i class="fas fa-user-clock"></i> Login Activity</a>
        <a href="#" class="sidebar-link"><i class="fas fa-file-lines"></i> Logs</a>
        <button class="sidebar-menu-button" id="bulkActionToggle" aria-expanded="false">
            <span><i class="fas fa-layer-group"></i> Bulk Actions</span>
            <i class="fas fa-chevron-down"></i>
        </button>
        <div class="bulk-action-menu" id="bulkActionMenu">
            <button class="bulk-broadcast" data-bulk-status="Broadcasted"><i class="fas fa-broadcast-tower"></i> Broadcast All Events</button>
            <button class="bulk-unbroadcast" data-bulk-status="Unbroadcasted"><i class="fas fa-stop"></i> Unbroadcast All Events</button>
        </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Back Navigation -->
    <div class="back-nav">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>

    <!-- Dashboard Title -->
    <div class="dashboard-title">
        <div>
        <h1><p style="color: var(--subtext-color); font-size: 4rem; margin-top: 1rem;"></h1>
        <p style="color: var(--subtext-color); font-size: 2rem; margin-top: 1rem;">Click on any event to view full information</p>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search concerts, sports, arts...">
        </div>

        <button id="searchBtn">
            <i class="fas fa-search"></i>
            Search
        </button>
    </div>

    <!-- Events Grid -->
    <div class="container" id="eventsGrid">
        <div class="card">
            <h2>Loading events...</h2>
        </div>
    </div>

    <script src="total-events.js"></script>
</body>
</html>
